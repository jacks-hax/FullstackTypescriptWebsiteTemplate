<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="application-name" content="{{!application_name}}" lang="en" />
        <meta name="description" content="{{!description}}" lang="en" />
        <meta name="theme-color" content="{{!theme_color}}" />
        <meta name="generator" content="jack" />
        <meta name="publisher" content="jack" />
        <meta name="creator" content="jack" />
        <title>{{!title}}</title>
        <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico" />
        <link rel="pingback" href="/pingback" />
        <link rel="canonical" href="https://{{!host}}/{{!canonical_path}}" />
        <link rel="preload" href="/assets/js/vendors.min.js" as="script" />
        <link rel="preload" href="/assets/js/runtime.min.js" as="script" />
        <link rel="stylesheet" href="/assets/css/main.min.css" />
        <script type="text/javascript">
            window.AppData = {{!app_data}}
        </script>
        <script id="react-vendors" src="/assets/js/vendors.min.js"></script>
        <script id="react-runtime" src="/assets/js/runtime.min.js"></script>
        <script id="react-app" src="/assets/js/app/index.min.js" defer></script>
        <script id="react-init-page" src="/assets/js/pages/{{!page}}/index.min.js" defer></script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
